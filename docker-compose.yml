# PHP2Shell lab: one vulnerable and one patched PHP + WordPress.
# Ports bind to 127.0.0.1 only, so nothing is exposed to your network.

services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: labroot
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - dbdata:/var/lib/mysql

  vulnerable:
    build:
      context: .
      args:
        PHP_VERSION: "8.3.35"   # last 8.3 release before the fix
    ports:
      - "127.0.0.1:8081:80"
    environment:
      WORDPRESS_DB_HOST: db
    depends_on: [db]

  patched:
    build:
      context: .
      args:
        PHP_VERSION: "8.3.36"   # fixed release
    ports:
      - "127.0.0.1:8082:80"
    depends_on: [db]

volumes:
  dbdata:
